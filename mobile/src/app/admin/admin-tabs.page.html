<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="citas" href="/admin/citas">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>Citas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="produccion" href="/admin/produccion">
      <ion-icon name="bar-chart-outline"></ion-icon>
      <ion-label>{{ esAdmin() ? 'Producción' : 'Mi producción' }}</ion-label>
    </ion-tab-button>

    @if (esAdmin()) {
      <ion-tab-button tab="servicios" href="/admin/servicios">
        <ion-icon name="cut-outline"></ion-icon>
        <ion-label>Servicios</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="usuarios" href="/admin/usuarios">
        <ion-icon name="people-outline"></ion-icon>
        <ion-label>Usuarios</ion-label>
      </ion-tab-button>
    }

    <ion-tab-button tab="perfil" href="/admin/perfil">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
