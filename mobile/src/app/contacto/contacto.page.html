<ion-header>
  <ion-toolbar>
    <ion-title>Contacto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="cabecera">
    <h2>{{ nombreSalon }}</h2>
    <p>¿Tienes alguna duda con tu cita? Escríbenos o llámanos.</p>
  </div>

  <ion-list inset="true">
    <ion-item lines="full">
      <ion-icon slot="start" name="location-outline" aria-hidden="true"></ion-icon>
      <ion-label class="ion-text-wrap">
        <p>Dirección</p>
        <h2>{{ calle }}</h2>
        <h2>{{ ciudad }}</h2>
      </ion-label>
    </ion-item>

    <!--
      Los href de tel: y mailto: no los abre el WebView: Capacitor los saca al
      sistema (marcador y cliente de correo). En navegador funcionan igual.
    -->
    <ion-item lines="full" [href]="telefonoEnlace" detail="false">
      <ion-icon slot="start" name="call-outline" aria-hidden="true"></ion-icon>
      <ion-label class="ion-text-wrap">
        <p>Teléfono</p>
        <h2>{{ telefono }}</h2>
      </ion-label>
    </ion-item>

    <ion-item lines="none" [href]="emailEnlace" detail="false">
      <ion-icon slot="start" name="mail-outline" aria-hidden="true"></ion-icon>
      <ion-label class="ion-text-wrap">
        <p>Email</p>
        <h2>{{ email }}</h2>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
